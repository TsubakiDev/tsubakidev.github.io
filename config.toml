base_url = "https://tsubaki.dev"
title = "Tsubaki's Blog"
description = "Here is tsubaki's personal blog."

default_language = "en"

build_search_index = true
generate_feeds = true

taxonomies = [
    {name = "tags", feed = true, paginate_by = 10},
]

minify_html = true
theme = "anemone"

[markdown]
render_emoji = true
external_links_target_blank = true
smart_punctuation = true
definition_list = true
bottom_footnotes = true
github_alerts = true
lazy_async_image = true
insert_anchor_links = "right"

[markdown.highlighting]
error_on_missing_language = false
style = "class"
light_theme = "github-light"
dark_theme = "gruvbox-dark-medium"

[extra]
author = "TsubakiDev"
list_pages = true
display_author = true
toc = true
mermaid = true

header_nav = [
  { url = "/", name_en = "/home/" },
  { url = "/blog", name_en = "/blog/" },
  { url = "/friends", name_en = "/friends/" },
]
